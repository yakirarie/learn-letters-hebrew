<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>לומדים עברית</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2196F3">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3409/3409040.png">
  <style>
    /* CSS Custom Properties for responsive design */
    :root {
      --app-max-width: 100%;
      --letter-size: clamp(80px, 18vw, 220px);
      --word-size: clamp(18px, 3.5vw, 42px);
      --picture-size: clamp(36px, 8vw, 48px);
      --btn-font-size: clamp(13px, 2.5vw, 18px);
      --tab-font-size: clamp(11px, 2vw, 15px);
      --tab-padding: clamp(6px 10px, 1.5vw 2.5vw, 10px 20px);
      --app-padding: clamp(0.5rem, 2vw, 1rem);
      --gap-sm: clamp(4px, 1vw, 10px);
      --gap-md: clamp(6px, 1.5vw, 14px);
      --gap-lg: clamp(8px, 2vw, 16px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff9f0; direction: rtl; -webkit-tap-highlight-color: transparent; min-height: 100vh; overflow-x: hidden; }
    #app { padding: var(--app-padding); text-align: center; max-width: var(--app-max-width); margin: 0 auto; width: 100%; }
    h1 { font-size: clamp(16px, 4vw, 20px); font-weight: 700; color: #333; margin-bottom: 0.2rem; line-height: 1.3; }

    .tabs { display: flex; gap: var(--gap-sm); justify-content: center; margin: 0.5rem 0; flex-wrap: wrap; }
    .learning-tabs { margin-bottom: 0.3rem; }
    .games-tabs { margin-top: 0.3rem; border-top: 1px solid #eee; padding-top: 0.5rem; }
    .tab-btn {
      font-size: var(--tab-font-size); font-weight: 600; padding: var(--tab-padding); border-radius: 20px;
      border: 1.5px solid #ddd; background: #fff; color: #666; cursor: pointer;
      transition: all 0.15s; font-family: inherit; white-space: nowrap;
      min-height: 36px; display: flex; align-items: center; justify-content: center;
    }
    .tab-btn.active { background: #222; color: #fff; border-color: #222; }

    #letter-display {
      font-size: var(--letter-size); font-weight: 700; line-height: 1; margin: 0.05rem 0;
      transition: transform 0.15s; cursor: pointer; display: inline-block; user-select: none;
      word-break: break-all;
    }
    /* Math expressions should be LTR even in RTL layout */
    .math-expression {
      direction: ltr;
      unicode-bidi: embed;
    }
    #letter-display:active { transform: scale(0.88); }
    #word-display { font-size: var(--word-size); font-weight: 600; color: #222; margin: 0.05rem 0; min-height: 40px; line-height: 1.4; }
    #picture { font-size: var(--picture-size); margin: 0.2rem 0; min-height: 80px; line-height: 1.2; word-break: break-all; }
    #prompt { font-size: clamp(13px, 3vw, 15px); color: #555; margin-bottom: 0.5rem; min-height: 26px; }
    #mode-label { font-size: clamp(10px, 2.5vw, 12px); color: #aaa; margin-bottom: 0.1rem; letter-spacing: 0.04em; }

    .word-chips { display: flex; gap: var(--gap-sm); flex-wrap: wrap; justify-content: center; margin: 0.3rem 0; }
    .chip {
      font-size: clamp(13px, 3.5vw, 15px); padding: 5px 14px; border-radius: 20px; border: 1.5px solid #ddd;
      background: #fff; cursor: pointer; transition: all 0.12s; font-family: inherit; font-weight: 500;
      min-height: 36px; display: flex; align-items: center; justify-content: center;
    }
    .chip:hover { background: #f5f5f5; }
    .chip.active { color: #fff; border-color: transparent; }

    .btn-row { display: flex; gap: var(--gap-md); justify-content: center; flex-wrap: wrap; margin-top: 0.4rem; }
    .tap-btn {
      font-size: var(--btn-font-size); font-weight: 500; padding: 11px 20px; border-radius: 14px;
      border: 1.5px solid #ddd; background: #fff; color: #222; cursor: pointer;
      transition: background 0.12s, transform 0.1s; font-family: inherit;
      min-height: 44px; display: flex; align-items: center; justify-content: center;
    }
    .tap-btn:hover { background: #f0f0f0; }
    .tap-btn:active { transform: scale(0.96); }

    .star-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin: 0.2rem 0; }
    .star { font-size: clamp(14px, 3.5vw, 16px); transition: transform 0.2s; }
    .star.lit { transform: scale(1.3); }
    #progress-bar-wrap { background: #eee; border-radius: 8px; height: 7px; margin: 0.4rem auto; max-width: 280px; overflow: hidden; width: 90%; }
    #progress-bar { height: 100%; border-radius: 8px; transition: width 0.4s; }

    #trace-section { display: none; }
    #trace-section.visible { display: block; }
    #trace-wrap { position: relative; display: inline-block; margin: 0.4rem 0; width: 100%; max-width: min(300px, 80vw); }
    #trace-ghost {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(120px, 40vw, 190px); font-weight: 700; opacity: 0.07; pointer-events: none;
      line-height: 1; user-select: none;
    }
    canvas#traceCanvas {
      border-radius: 16px; border: 2px dashed #ccc; background: #fffdf8;
      touch-action: none; cursor: crosshair; display: block;
      width: 100%; max-width: min(300px, 80vw); aspect-ratio: 1;
    }
    .trace-controls { display: flex; gap: var(--gap-md); justify-content: center; margin-top: 0.4rem; flex-wrap: wrap; align-items: center; }
    .color-dot {
      width: clamp(24px, 6vw, 28px); height: clamp(24px, 6vw, 28px); border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: transform 0.12s; flex-shrink: 0;
    }
    .color-dot.selected { border-color: #333; transform: scale(1.25); }

    #memory-section { display: none; }
    #memory-section.visible { display: block; }
    .memory-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap-sm); margin: 0.5rem auto; max-width: min(500px, 90vw); }
    .mem-card {
      aspect-ratio: 1; border-radius: 12px; border: 2px solid #ddd; background: #fff;
      display: flex; align-items: center; justify-content: center; font-size: clamp(20px, 5vw, 32px); font-weight: 700;
      cursor: pointer; transition: all 0.2s; user-select: none;
      min-height: 50px;
    }
    .mem-card.flipped { background: #e8f4ff; border-color: #90caf9; }
    .mem-card.matched { background: #e8f5e9; border-color: #81c784; opacity: 0.75; }
    .mem-card.shake { animation: shake 0.4s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    #mem-score { font-size: clamp(13px, 3vw, 15px); color: #555; margin: 0.4rem 0; font-weight: 500; }

    /* Sound toggle button - responsive positioning */
    #sound-toggle {
      position: fixed; top: clamp(8px, 2vw, 16px); right: clamp(8px, 2vw, 16px); z-index: 1000;
      width: clamp(40px, 8vw, 52px); height: clamp(40px, 8vw, 52px); padding: 0; font-size: clamp(18px, 4vw, 24px); border-radius: 50%;
    }

    #update-banner {
      background: #ffeb3b; color: #333; border: 1px solid #fbc02d; border-radius: 10px;
      padding: 8px 10px; margin: 8px auto; max-width: var(--app-max-width); text-align: center;
    }

    /* Responsive adjustments for very small screens */
    @media (max-width: 360px) {
      :root {
        --app-padding: 0.4rem;
      }
      .tabs { gap: 4px; }
      .tab-btn { font-size: 10px; padding: 5px 8px; min-height: 32px; }
      #sound-toggle { width: 38px; height: 38px; top: 6px; right: 6px; font-size: 16px; }
      h1 { font-size: 14px; }
      .memory-grid { gap: 4px; grid-template-columns: repeat(4, 1fr); }
      .mem-card { min-height: 45px; font-size: 24px; }
    }

    /* Small phones in portrait */
    @media (max-width: 320px) {
      .memory-grid { grid-template-columns: repeat(5, 1fr); gap: 3px; }
      .mem-card { min-height: 40px; font-size: 20px; border-radius: 8px; }
      .color-dot { width: 26px; height: 26px; }
    }

    /* Tablet and larger screens */
    @media (min-width: 768px) {
      :root {
        --app-max-width: 100%;
      }
      #app { padding: 1rem 2rem; }
      .memory-grid { gap: 14px; max-width: min(700px, 85vw); margin: 0.5rem auto; }
      .mem-card { min-height: 70px; font-size: clamp(24px, 4vw, 36px); }
      canvas#traceCanvas { max-width: min(400px, 70vw); }
      #trace-ghost { font-size: clamp(150px, 30vw, 220px); }
    }

    /* Desktop screens */
    @media (min-width: 1024px) {
      :root {
        --app-max-width: 100%;
      }
      body { display: flex; justify-content: center; align-items: flex-start; padding-top: 2rem; }
      #app { max-width: 800px; }
      .memory-grid { max-width: 700px; }
      canvas#traceCanvas { max-width: 500px; }
    }

    /* Landscape orientation adjustments - phones */
    @media (max-height: 500px) and (orientation: landscape) {
      #app { padding: 0.3rem 0.5rem; }
      h1 { margin-bottom: 0.1rem; font-size: 14px; }
      #letter-display { font-size: clamp(50px, 12vw, 80px); margin: 0.02rem 0; }
      #picture { font-size: clamp(30px, 7vw, 45px); margin: 0.05rem 0; min-height: 40px; }
      #word-display { font-size: clamp(14px, 3.5vw, 20px); margin: 0.02rem 0; min-height: 26px; }
      .tabs { margin: 0.2rem 0; gap: 3px; }
      .learning-tabs { margin-bottom: 0.15rem; }
      .games-tabs { margin-top: 0.15rem; padding-top: 0.2rem; }
      .tab-btn { font-size: 10px; padding: 4px 8px; min-height: 28px; }
      canvas#traceCanvas { max-width: 200px; }
      #trace-ghost { font-size: 130px; }
      .memory-grid { gap: 4px; }
      .mem-card { min-height: 40px; font-size: 22px; }
      #sound-toggle { width: 36px; height: 36px; top: 5px; right: 5px; font-size: 16px; }
    }

    /* Landscape orientation - tablets */
    @media (min-width: 768px) and (orientation: landscape) {
      #app { padding: 0.5rem 1.5rem; max-width: 900px; }
      h1 { font-size: clamp(16px, 2vw, 22px); }
      #letter-display { font-size: clamp(80px, 12vw, 140px); }
      #picture { font-size: clamp(36px, 6vw, 56px); }
      #word-display { font-size: clamp(18px, 2.5vw, 32px); }
      canvas#traceCanvas { max-width: min(350px, 50vw); height: auto; }
      #trace-ghost { font-size: clamp(140px, 25vw, 200px); }
      .memory-grid { max-width: min(600px, 80vw); gap: 12px; }
      .mem-card { min-height: 60px; font-size: clamp(22px, 3.5vw, 30px); }
    }

    /* Portrait orientation optimizations */
    @media (orientation: portrait) {
      #app { padding-bottom: 1rem; }
      .memory-grid { max-width: min(550px, 90vw); margin: 0.5rem auto; }
    }

    /* Ensure touch targets are at least 44px for accessibility */
    @media (pointer: coarse) {
      .tab-btn, .tap-btn, .chip { min-height: 44px; }
      .color-dot { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
<div id="app">
  <h1>לוֹמְדִים עִבְרִית 📖</h1>
  <button id="sound-toggle" class="tab-btn">🔊</button>
  <div id="update-banner" style="display:none; background:#ffeb3b; color:#333; border:1px solid #fbc02d; border-radius:10px; padding:8px 10px; margin:8px auto; max-width:500px; text-align:center;">
    גִּרְסָה חֲדָשָׁה זְמִינָה. <button id="refresh-btn" class="tab-btn" style="font-size:13px; padding:5px 10px;">טְעַן מֵחָדָשׁ</button>
  </div>

  <div class="tabs learning-tabs" id="learning-tabs">
    <button class="tab-btn active" data-target="learn" onclick="switchTab('learn')">📚 אוֹתִיּוֹת</button>
    <button class="tab-btn" data-target="numbers" onclick="switchTab('numbers')">🔢 מִסְפָּרִים</button>
    <button class="tab-btn" data-target="math" onclick="switchTab('math')">חֶשְׁבּוֹן ➕➖</button>
  </div>
  <div class="tabs games-tabs" id="games-tabs">
    <button class="tab-btn" data-target="quiz" onclick="switchTab('quiz')">🎮 חִידּוֹן</button>
    <button class="tab-btn" data-target="trace" onclick="switchTab('trace')">✏️ כְּתִיבָה</button>
    <button class="tab-btn" data-target="memory" onclick="switchTab('memory')">🃏 זִכָּרוֹן</button>
  </div>

  <div id="mode-label"></div>
  <div class="star-row" id="stars"></div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>

  <div id="main-display">
    <div id="letter-display" onclick="onLetterTap()"></div>
    <div id="picture"></div>
    <div id="word-display"></div>
    <div class="word-chips" id="word-chips"></div>
    <div id="prompt"></div>
    <div class="btn-row" id="btn-row"></div>
  </div>

    <div id="trace-section">
      <div id="trace-letter-label" style="font-size:20px;font-weight:700;color:#333;margin:0.3rem 0;"></div>
      <!-- Mode selection buttons (top) -->
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom:8px;">
        <button class="tap-btn" onclick="setTraceMode('letters')" style="padding:6px 16px;font-size:14px;">📚 אוֹתִיּוֹת</button>
        <button class="tap-btn" onclick="setTraceMode('numbers')" style="padding:6px 16px;font-size:14px;">🔢 מִסְפָּרִים</button>
        <button class="tap-btn" onclick="setTraceMode('pictures')" style="padding:6px 16px;font-size:14px;">🖼️ תְמוּנוֹת</button>
      </div>
      <!-- Canvas -->
      <div id="trace-wrap">
        <div id="trace-ghost"></div>
        <canvas id="traceCanvas" width="300" height="300"></canvas>
      </div>
      <!-- Color palette -->
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin:8px 0;">
        <div class="color-dot selected" style="background:#2196F3" onclick="setColor('#2196F3',this)"></div>
        <div class="color-dot" style="background:#E84040" onclick="setColor('#E84040',this)"></div>
        <div class="color-dot" style="background:#4CAF50" onclick="setColor('#4CAF50',this)"></div>
        <div class="color-dot" style="background:#FF9800" onclick="setColor('#FF9800',this)"></div>
        <div class="color-dot" style="background:#9C27B0" onclick="setColor('#9C27B0',this)"></div>
        <div class="color-dot" style="background:#E91E63" onclick="setColor('#E91E63',this)"></div>
        <div class="color-dot" style="background:#00BCD4" onclick="setColor('#00BCD4',this)"></div>
        <div class="color-dot" style="background:#FFD600" onclick="setColor('#FFD600',this)"></div>
        <div class="color-dot" style="background:#795548" onclick="setColor('#795548',this)"></div>
        <div class="color-dot" style="background:#607D8B" onclick="setColor('#607D8B',this)"></div>
        <div class="color-dot" style="background:#FF7043" onclick="setColor('#FF7043',this)"></div>
        <div class="color-dot" style="background:#222222" onclick="setColor('#222222',this)"></div>
      </div>
      <!-- Navigation buttons -->
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button class="tap-btn" onclick="clearTrace()" style="padding:6px 16px;font-size:14px;">🗑️ נַקֵּה</button>
        <button class="tap-btn" onclick="tracePrev()" style="padding:6px 16px;font-size:14px;">קוֹדֵם ➡</button>
        <button class="tap-btn" onclick="traceNext()" style="padding:6px 16px;font-size:14px;">⬅ הַבָּא</button>
      </div>
  </div>

  <div id="memory-section">
    <div id="mem-score"></div>
    <div class="memory-grid" id="memory-grid"></div>
    <div class="btn-row" style="margin-top:0.5rem;">
      <button class="tap-btn" onclick="startMemory()">🔄 מִשְׂחָק חָדָשׁ</button>
    </div>
  </div>
</div>

<script>
const letters = [
  { l:'א', examples:[{word:'אַרְנָב',pic:'🐰'},{word:'אַרְיֵה',pic:'🦁'},{word:'אֲבַטִּיחַ',pic:'🍉'},{word:'אוֹטוֹ',pic:'🚗'}], color:'#E84040' },
  { l:'ב', examples:[{word:'בַּיִת',pic:'🏠'},{word:'בַּלּוֹן',pic:'🎈'},{word:'בַּנָּנָה',pic:'🍌'},{word:'בּוּבָּה',pic:'🪆'}], color:'#2196F3' },
  { l:'ג', examples:[{word:'גָּמָל',pic:'🐪'},{word:'גֶּשֶׁר',pic:'🌉'},{word:'גֶּזֶר',pic:'🥕'},{word:'גְּלִידָה',pic:'🍦'}], color:'#FF9800' },
  { l:'ד', examples:[{word:'דָּג',pic:'🐟'},{word:'דֹּב',pic:'🐻'},{word:'דֶּלֶת',pic:'🚪'},{word:'דְּבַשׁ',pic:'🍯'}], color:'#00BCD4' },
  { l:'ה', examples:[{word:'הַר',pic:'⛰️'},{word:'הֲדַס',pic:'🌿'},{word:'הֶלִיקוֹפְּטֶר',pic:'🚁'}], color:'#795548' },
  { l:'ו', examples:[{word:'וֶרֶד',pic:'🌹'},{word:'וִילוֹן',pic:'🪟'},{word:'וָרֹד',pic:'🩷'}], color:'#E91E63' },
  { l:'ז', examples:[{word:'זְאֵב',pic:'🐺'},{word:'זַיִת',pic:'🫒'},{word:'זֶבְּרָה',pic:'🦓'},{word:'זְרוּעַ',pic:'💪'}], color:'#607D8B' },
  { l:'ח', examples:[{word:'חָתוּל',pic:'🐱'},{word:'חֲמוֹר',pic:'🫏'},{word:'חָלָב',pic:'🥛'},{word:'חַמָּנִיָּה',pic:'🌻'}], color:'#FF7043' },
  { l:'ט', examples:[{word:'טָלֶה',pic:'🐑'},{word:'טִיגְרִיס',pic:'🐯'},{word:'טֶלֶפוֹן',pic:'📱'},{word:'טַוָּס',pic:'🦚'}], color:'#9C27B0' },
  { l:'י', examples:[{word:'יָרֵחַ',pic:'🌙'},{word:'יָם',pic:'🌊'},{word:'יוֹנָה',pic:'🕊️'},{word:'יֶלֶד',pic:'👦'}], color:'#3F51B5' },
  { l:'כ', examples:[{word:'כֶּלֶב',pic:'🐶'},{word:'כּוֹכָב',pic:'⭐'},{word:'כִּסֵּא',pic:'🪑'},{word:'כַּדּוּר',pic:'⚽'}], color:'#8B6914' },
  { l:'ל', examples:[{word:'לֵב',pic:'❤️'},{word:'לִוְיָתָן',pic:'🐋'},{word:'לֶחֶם',pic:'🍞'},{word:'לִימוֹן',pic:'🍋'}], color:'#F44336' },
  { l:'מ', examples:[{word:'מָטוֹס',pic:'✈️'},{word:'מְכוֹנִית',pic:'🚙'},{word:'מִגְדָּל',pic:'🗼'},{word:'מְלָפְפוֹן',pic:'🥒'}], color:'#4CAF50' },
  { l:'נ', examples:[{word:'נָחָשׁ',pic:'🐍'},{word:'נָמֵר',pic:'🐆'},{word:'נֵר',pic:'🕯️'},{word:'נֶשֶׁר',pic:'🦅'}], color:'#009688' },
  { l:'ס', examples:[{word:'סוּס',pic:'🐴'},{word:'סֵפֶר',pic:'📚'},{word:'סִירָה',pic:'⛵'},{word:'סְנָאי',pic:'🐿️'}], color:'#795548' },
  { l:'ע', examples:[{word:'עוּגָה',pic:'🎂'},{word:'עַגְבָנִיָּה',pic:'🍅'},{word:'עֵץ',pic:'🌳'},{word:'עַכְבָּר',pic:'🐭'}], color:'#E91E63' },
  { l:'פ', examples:[{word:'פַּרְפַּר',pic:'🦋'},{word:'פֶּרַח',pic:'🌸'},{word:'פִּיל',pic:'🐘'},{word:'פִּינְגְּוִין',pic:'🐧'}], color:'#9C27B0' },
  { l:'צ', examples:[{word:'צָב',pic:'🐢'},{word:'צְפַרְדֵּעַ',pic:'🐸'},{word:'צְבִי',pic:'🦌'},{word:'צָהֹב',pic:'💛'}], color:'#4CAF50' },
  { l:'ק', examples:[{word:'קוֹף',pic:'🐒'},{word:'קִיפּוֹד',pic:'🦔'},{word:'קֶשֶׁת',pic:'🌈'},{word:'קַרְנָף',pic:'🦏'}], color:'#FF9800' },

// Helper function to get the Hebrew text for a number with object name
// Handles special cases for 1 (reversed order), 2 (special form), and 11+ (male plural)
function getNumberWithObject(emoji, count, numberWord) {
  const objInfo = objectNames[emoji];
  if (!objInfo) return numberWord;
  
  if (count === 1) {
    // For 1: object comes first, then number (e.g., "תפוח אחד")
    return objInfo.singular + ' ' + numberWord;
  } else if (count === 2) {
    // For 2: use "שני" instead of "שניים" when with a noun
    return 'שְׁנֵי ' + objInfo.plural;
  } else if (count >= 11) {
    // For 11+: number first, then object in masculine plural (e.g., "אחד עשר תפוחים")
    return numberWord + ' ' + objInfo.plural;
  } else {
    // For 3-10: number first, then object (e.g., "שלושה פרחים")
    return numberWord + ' ' + objInfo.plural;
  }
}

let wordplayChallenges = [];

function startMathPlay() {
  mathChallenges = [];
  const emojis = ['🍎', '⚽', '🌸', '🐱', '🐟', '🍌', '🍇', '🍓', '🍑', '🍍'];
  
  for (let i = 0; i < 15; i++) {
    const isAddition = Math.random() > 0.5;
    let a, b, answer, expr;
    if (isAddition) {
      a = Math.floor(Math.random() * 5) + 1;
      b = Math.floor(Math.random() * 5) + 1;
      answer = a + b;
      expr = `${a} + ${b}`;
    } else {
      a = Math.floor(Math.random() * 5) + 6;
      b = Math.floor(Math.random() * 5) + 1;
      answer = a - b;
      expr = `${a} - ${b}`;
    }
    mathChallenges.push({ expr, answer });
  }
  
  mathChallenges = shuffle(mathChallenges);
  mathIndex = 0;
  showCountChallenge();
}

function speakEquation() {
  if (mathChallenges.length == 0 || mathIndex >= mathChallenges.length) {
    return;
  }
  const challenge = mathChallenges[mathIndex];
  const parts = challenge.expr.split(' ');
  const num1 = parts[0];
  const operator = parts[1];
  const num2 = parts[2];
  const operatorWord = operator === '+' ? 'וְעוֹד' : 'פָּחוֹת';
  speak(num1 + ' ' + operatorWord + ' ' + num2 + ' שָׁוֶה ' + challenge.answer, 0.8, 1.2);
}

function showCountChallenge() {
  const challenge = mathChallenges[mathIndex];
  const parts    = challenge.expr.split(' ');
  const num1     = parseInt(parts[0]);
  const operator = parts[1];
  const num2     = parseInt(parts[2]);
  const answer   = challenge.answer;

  // ── your existing DOM setup (unchanged) ──────────────────
  const letterDisplay = document.getElementById('letter-display');
  letterDisplay.innerHTML = `<span class="math-expression">${challenge.expr} = ${answer}</span>`;
  letterDisplay.style.fontSize = '60px';
  letterDisplay.style.color    = '#3f51b5';
  letterDisplay.onclick        = onLetterTap;

  document.getElementById('word-display').textContent = '';
  document.getElementById('word-chips').innerHTML   = '';
  document.getElementById('mode-label').textContent  = 'חֶשְׁבּוֹן וְכַמּוּיוֹת';
  document.getElementById('prompt').textContent       = '';

  // ── new visual ───────────────────────────────────────────
  const EMOJIS = ['🍎','⚽','🌟','🐱','🐸','🍌','🦋','🍓','🐠','🌈'];
  const emoji = EMOJIS[mathIndex % EMOJIS.length];
  const pic   = document.getElementById('picture');

  // inject keyframes once
  if (!document.getElementById('math-anim-style')) {
    const s = document.createElement('style');
    s.id = 'math-anim-style';
    s.textContent = `
      @keyframes popIn    { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
      @keyframes fadeOut  { 0%{transform:scale(1);opacity:1} 100%{transform:scale(0);opacity:0} }
      @keyframes slideIn  { 0%{transform:translateX(60px);opacity:0} 100%{transform:translateX(0);opacity:1} }
      .math-item { font-size:36px; display:inline-block; animation: popIn .6s ease both; }`;
    document.head.appendChild(s);
  }

  // cancel any pending timeouts from previous run
  if (window._mathTimers) window._mathTimers.forEach(clearTimeout);
  window._mathTimers = [];
  const later = (fn, ms) => { const t = setTimeout(fn, ms); window._mathTimers.push(t); };

  // build an emoji row, each item delayed so they appear one-by-one
  function makeRow(count, delayOffset = 0) {
    return Array.from({length: count}, (_, i) =>
      `<span class="math-item" style="animation-delay:${(delayOffset + i) * 0.15}s">${emoji}</span>`
    ).join('');
  }

  if (operator === '+') {
        // Phase 1: two groups with + and a gap between them
    pic.innerHTML = `
      <div id="scene" style="display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:8px 0;transition:gap .8s ease;">
        <div id="groupA" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:180px;">${makeRow(num1)}</div>
        <div id="groupSep" style="font-size:32px;color:#aaa;">+</div>
        <div id="groupB" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:180px;">${makeRow(num2, num1)}</div>
      </div>`;

    // Phase 2: remove + and collapse gap so the two groups slide together
    later(() => {
      document.getElementById('groupSep').remove();
      document.getElementById('scene').style.gap = '4px';
    }, 2000);

  } else {
    // Phase 1: show full group, subtracted items last (so they have higher indexes)
    pic.innerHTML = `
      <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:300px;margin:8px auto;">
        ${makeRow(answer)}${makeRow(num2, answer)}</div>`;

    // Phase 2: fade out the subtracted items in place — no reload needed
    later(() => {
      const items = pic.querySelectorAll('.math-item');
      for (let i = answer; i < num1; i++) {
        items[i].style.animationDelay = `${(i - answer) * 0.3}s`;
        items[i].style.animation      = 'fadeOut .7s ease forwards';
      }
    }, 2000);
  }

  // ── your existing nav + speech (unchanged) ───────────────
  renderBtns([
    { label: 'קוֹדֵם ➡', fn: () => { if (mathIndex > 0)                        { mathIndex--; showCountChallenge(); } } },
    { label: '⬅ hַבָּא', fn: () => { if (mathIndex < mathChallenges.length - 1) { mathIndex++; showCountChallenge(); } } },
  ]);

  speakEquation();
}

}

function startQuiz() {
  quizScore = 0;
  quizIdx = 0;
  answered = false;
  mathChallenges = []; // Clear previous challenges

  // Generate equal distribution: 33% letters, 33% numbers/counting, 33% math
  const itemsPerType = 8; // 8 items per type = 24 total questions
  
  // Letters - pick random letters
  const letterIndices = shuffle([...Array(letters.length).keys()]).slice(0, itemsPerType);
  const letterItems = letterIndices.map(idx => ({ type: 'letter', idx }));
  
  // Numbers - show emojis and ask "כמה פריטים יש כאן?" (same as counting)
  const emojis = ['🍎', '⚽', '🌸', '🐱', '🐟', '🍌', '🍇', '🍓', '🍑', '🍍', '🥝', '🍉', '🍒', '🍊', '🥭', '🍋', '🍐', '🥥', '🥑', '🌶️'];
  const numberItems = [];
  const numberIndices = shuffle([...Array(numbers.length).keys()]).slice(0, itemsPerType);
  for (let i = 0; i < itemsPerType; i++) {
    const numIdx = numberIndices[i];
    const num = numbers[numIdx];
    const emoji = emojis[numIdx % emojis.length];
    const icons = emoji.repeat(num.n);
    numberItems.push({ type: 'number', idx: mathChallenges.length });
    mathChallenges.push({ icons, answer: num.n, type: 'number' });
  }
  
  // Math challenges (addition and subtraction)
  const mathItems = [];
  for (let i = 0; i < itemsPerType; i++) {
    const isAddition = Math.random() > 0.5;
    let a, b, answer, expr;
    if (isAddition) {
      a = Math.floor(Math.random() * 5) + 1;
      b = Math.floor(Math.random() * 5) + 1;
      answer = a + b;
      expr = `${a} + ${b}`;
    } else {
      a = Math.floor(Math.random() * 5) + 6;
      b = Math.floor(Math.random() * 5) + 1;
      answer = a - b;
      expr = `${a} - ${b}`;
    }
    mathItems.push({ type: 'math', idx: mathChallenges.length });
    mathChallenges.push({ expr, answer, type: 'math' });
  }
  
  // Combine all items and shuffle
  quizItems = shuffle([...letterItems, ...numberItems, ...mathItems]);
  document.getElementById('word-chips').innerHTML = '';
  nextMixedQuiz();
}

function nextMixedQuiz() {
  if (quizIdx >= quizItems.length) { showCelebration(); return; }
  answered = false;
  currentQuizItem = quizItems[quizIdx];
  document.getElementById('word-chips').innerHTML = '';

  if (currentQuizItem.type === 'letter') {
    const d = letters[currentQuizItem.idx];
    const ex = pickExample(currentQuizItem.idx);
    document.getElementById('letter-display').textContent = ex.pic;
    document.getElementById('letter-display').style.fontSize = '130px';
    document.getElementById('letter-display').onclick = () => {
      speak(ex.word, 0.75, 1.3);
    };
    document.getElementById('picture').textContent = '';
    document.getElementById('word-display').textContent = 'בְּאֵיזוֹ אוֹת מַתְחִילָה הַמִּלָּה?';
    document.getElementById('mode-label').textContent = 'חִידּוֹן אוֹתִיּוֹת';
    document.getElementById('prompt').textContent = '';

    const pool = shuffle(letters.filter((_, i) => i !== currentQuizItem.idx)).slice(0, 3).map(x => x.l);
    const choices = shuffle([d.l, ...pool]);
    renderBtns(choices.map(ch => ({ label: ch, fn: () => checkQuizAnswer(ch), big: true })));
    speak('באיזו אות מתחילה המילה ' + ex.word + '?', 0.8, 1.2);

  } else if (currentQuizItem.type === 'number') {
    const c = mathChallenges[currentQuizItem.idx];
    // Show emojis and ask how many items
    document.getElementById('picture').textContent = c.icons;
    document.getElementById('picture').style.color = '#3f51b5';
    document.getElementById('picture').style.fontSize = '40px';
    document.getElementById('letter-display').textContent = '';
    document.getElementById('word-display').textContent = 'כַּמָּה פְּרִיטִים יֵשׁ כָּאן?';
    document.getElementById('mode-label').textContent = 'חִידּוֹן כַּמּוּת';
    document.getElementById('prompt').textContent = '';

    const options = shuffle([c.answer, c.answer + 1, c.answer - 1, c.answer + 2]
      .map(n => Math.max(1, Math.min(30, n)))
      .filter((v, i, a) => a.indexOf(v) === i));
    renderBtns(options.map(n => ({ label: String(n), fn: () => checkQuizAnswer(n), big: true })));
    speak('כמה פריטים יש כאן?', 0.8, 1.2);

  } else if (currentQuizItem.type === 'math') {
    const c = mathChallenges[currentQuizItem.idx];
    document.getElementById('picture').innerHTML = '<span class="math-expression">' + c.expr + ' = ?</span>';
    document.getElementById('picture').style.color = '#3f51b5';
    document.getElementById('picture').style.fontSize = '50px';
    document.getElementById('letter-display').textContent = '';
    document.getElementById('word-display').textContent = 'כַּמָּה זֶה?';
    document.getElementById('mode-label').textContent = 'חִידּוֹן חֶשְׁבּוֹן';
    document.getElementById('prompt').textContent = '';

    const options = shuffle([c.answer, c.answer + 1, c.answer - 1, c.answer + 2]
      .map(n => Math.max(0, Math.min(20, n)))
      .filter((v, i, a) => a.indexOf(v) === i));
    renderBtns(options.map(n => ({ label: String(n), fn: () => checkQuizAnswer(n), big: true })));
    
    // Speak the equation in Hebrew
    const parts = c.expr.split(' ');
    const num1 = parts[0];
    const operator = parts[1];
    const num2 = parts[2];
  const operatorWord = operator === '+' ? 'וְעוֹד' : 'פָּחוֹת';
  speak(num1 + ' ' + operatorWord + ' ' + num2 + ' שָׁוֶה?', 0.8, 1.2);
  }

  renderStars();
}

function checkQuizAnswer(chosen) {
  if (answered) return;
  answered = true;

  let correctAnswer;
  let confirmationText = '';

  if (currentQuizItem.type === 'letter') {
    correctAnswer = letters[currentQuizItem.idx].l;
    confirmationText = 'כְּמוֹ ' + pickExample(currentQuizItem.idx).word;
  } else if (currentQuizItem.type === 'number' || currentQuizItem.type === 'count') {
    const c = mathChallenges[currentQuizItem.idx];
    correctAnswer = c.answer;
    confirmationText = 'הַתְּשׁוּבָה נְכוֹנָה הִיא ' + correctAnswer;
  } else {
    const c = mathChallenges[currentQuizItem.idx];
    correctAnswer = c.answer;
    confirmationText = 'הַתְּשׁוּבָה נְכוֹנָה הִיא ' + correctAnswer;
  }

  if (String(chosen) === String(correctAnswer)) {
    quizScore++;
    document.getElementById('prompt').textContent = '🎉 מְצֻיָּן! ' + confirmationText;
    speak('כָּל הַכָּבוֹד!', 0.85, 1.4);
    renderStars();
    setTimeout(() => { quizIdx++; nextMixedQuiz(); }, 1400);
  } else {
    document.getElementById('prompt').textContent = '🤔 לֹא בְּדִיּוּק, נַסּוּ שׁוּב.';
    speak('נַסּוּ שׁוּב', 0.8, 1.1);
    setTimeout(() => { answered = false; document.getElementById('prompt').textContent = ''; }, 1000);
  }
}

(function() {
  const canvas = document.getElementById('traceCanvas');
  const ctx = canvas.getContext('2d');
  let drawing = false, lx = 0, ly = 0;

  // Set fixed canvas size that matches the HTML attributes
  // The canvas has width="300" height="300" in HTML, so we use that as base
  function initCanvas() {
    // Ensure canvas has proper size
    if (canvas.width === 0 || canvas.height === 0) {
      canvas.width = 300;
      canvas.height = 300;
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = traceColor;
    ctx.lineWidth = 11;
  }

  initCanvas();

  // Get position relative to canvas, accounting for CSS scaling
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;

    // Calculate the scale between CSS pixels and canvas pixels
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top) * scaleY
    };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    const p = getPos(e);
    lx = p.x;
    ly = p.y;

    // Draw a dot for single taps
    ctx.beginPath();
    ctx.arc(lx, ly, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = traceColor;
    ctx.fill();
  }

  function move(e) {
    e.preventDefault();
    if (!drawing) return;
    const p = getPos(e);

    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = traceColor;
    ctx.lineWidth = 11;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    lx = p.x;
    ly = p.y;
  }

  function end(e) {
    e.preventDefault();
    drawing = false;
  }

  // Mouse events
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);

  // Touch events
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end, { passive: false });
  canvas.addEventListener('touchcancel', end, { passive: false });
})();

// ── MEMORY GAME ───────────────────────────────────────────────────────
function startMemory() {
  document.getElementById('mode-label').textContent = 'מִשְׂחָק הַזִּכָּרוֹן הִתְחִיל';
  memFlipped = []; memPairs = 0; memMoves = 0; memLock = false;

  // Create pool of items: letters, numbers, and pictures (emojis)
  const itemPool = [];
  
  // Add some letters
  const letterIndices = shuffle([...Array(letters.length).keys()]).slice(0, 5);
  letterIndices.forEach(i => {
    itemPool.push({ id: 'l_' + letters[i].l, display: letters[i].l, color: letters[i].color, category: 'letter' });
  });
  
  // Add some numbers
  const numberIndices = shuffle([...Array(numbers.length).keys()]).slice(0, 5);
  numberIndices.forEach(i => {
    itemPool.push({ id: 'n_' + numbers[i].n, display: numbers[i].n, color: numbers[i].color, category: 'number' });
  });
  
  // Add some pictures (emojis from letters examples)
  const usedPics = new Set();
  const shuffledLetters = shuffle([...letters]);
  for (const l of shuffledLetters) {
    if (itemPool.length >= 13) break;
    const ex = l.examples[0];
    if (!usedPics.has(ex.pic)) {
      usedPics.add(ex.pic);
      itemPool.push({ id: 'p_' + ex.pic, display: ex.pic, color: l.color, category: 'picture' });
    }
  }

  // For 5x5 grid we need 12 pairs + 1 single card = 25 cards
  // Select 12 items and create pairs, plus 1 extra single card
  const chosen = shuffle(itemPool).slice(0, 12);
  const pairs = [];
  
  chosen.forEach(item => {
    pairs.push({ id: item.id, display: item.display, color: item.color, category: item.category });
    pairs.push({ id: item.id, display: item.display, color: item.color, category: item.category });
  });
  
  // Add 1 more single card to make it 25 (5x5)
  const extraItem = shuffle(itemPool.filter(it => !chosen.includes(it))).slice(0, 1)[0];
  if (extraItem) {
    pairs.push({ id: extraItem.id, display: extraItem.display, color: extraItem.color, category: extraItem.category });
  }

  memCards = shuffle(pairs).map((c, i) => ({ ...c, idx: i, flipped: false, matched: false }));
  document.getElementById('mem-score').textContent = 'מִצְאוּ אֶת כָּל הַזּוּגוֹת! 🔍 (12 זוּגוֹת)';
  renderMemory();
}

function renderMemory() {
  const grid = document.getElementById('memory-grid');
  grid.innerHTML = '';
  memCards.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'mem-card' + (c.flipped||c.matched ? ' flipped' : '') + (c.matched ? ' matched' : '');
    // Adjust font size based on content type
    if (c.category === 'letter') {
      div.style.fontSize = 'clamp(24px, 5vw, 36px)';
    } else if (c.category === 'number') {
      div.style.fontSize = 'clamp(28px, 6vw, 40px)';
    } else {
      div.style.fontSize = 'clamp(28px, 6vw, 40px)';
    }
    if (c.flipped || c.matched) {
      div.textContent = c.display;
      div.style.color = c.color;
    } else {
      div.textContent = '?';
      div.style.color = '#ccc';
    }
    div.onclick = () => flipCard(i);
    grid.appendChild(div);
  });
}

function flipCard(i) {
  if (memLock || memCards[i].flipped || memCards[i].matched) return;
  memCards[i].flipped = true;
  memFlipped.push(i);
  renderMemory();
  
  // Speak the content
  const card = memCards[i];
  if (card.category === 'letter') {
    speak(card.display, 0.8, 1.3);
  } else if (card.category === 'number') {
    speak(String(card.display), 0.8, 1.2);
  } else {
    // For pictures, find the Hebrew word
    const letter = letters.find(l => l.examples.some(e => e.pic === card.display));
    if (letter) {
      const ex = letter.examples.find(e => e.pic === card.display);
      if (ex) speak(ex.word, 0.8, 1.3);
    }
  }

  if (memFlipped.length === 2) {
    memLock = true; memMoves++;
    const [a, b] = memFlipped;
    if (memCards[a].id === memCards[b].id) {
      memCards[a].matched = memCards[b].matched = true;
      memPairs++;
      memFlipped = []; memLock = false;
      speak('כָּל הַכָּבוֹד! זוּג!', 0.85, 1.4);
      document.getElementById('mem-score').textContent = 'זוּגוֹת: ' + memPairs + '/12 | מַהֲלָכִים: ' + memMoves;
      renderMemory();
      if (memPairs === 12) setTimeout(() => {
        speak('מַדְהִים! מָצָאתָ אֶת כָּל הַזּוּגוֹת!', 0.8, 1.4);
        document.getElementById('mem-score').textContent = '🏆 מְעֻלֶּה! ' + memMoves + ' מַהֲלָכִים בְּסֵךְ הַכֹּל!';
      }, 400);
    } else {
      setTimeout(() => {
        memCards[a].flipped = memCards[b].flipped = false;
        memFlipped = []; memLock = false;
        document.getElementById('mem-score').textContent = 'נַסּוּ שׁוּב! מַהֲלָכִים: ' + memMoves;
        renderMemory();
      }, 900);
    }
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('Service Worker registered!', reg.scope);

        function showUpdateBanner() {
          const banner = document.getElementById('update-banner');
          const refreshBtn = document.getElementById('refresh-btn');
          if (!banner || !refreshBtn) return;
          banner.style.display = 'block';
          console.log('Update available - showing banner');
          refreshBtn.onclick = () => {
            if (reg.waiting) {
              reg.waiting.postMessage({ action: 'skipWaiting' });
            } else if (reg.installing) {
              reg.installing.postMessage({ action: 'skipWaiting' });
            }
          };
        }

        // Check if there's already a waiting service worker
        if (reg.waiting) {
          showUpdateBanner();
        }

        // Listen for updates to the service worker
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          
          console.log('New service worker installing...', newWorker.state);
          
          newWorker.addEventListener('statechange', () => {
            console.log('Service worker state change:', newWorker.state);
            
            if (newWorker.state === 'installed') {
              // New service worker is installed and waiting
              if (navigator.serviceWorker.controller) {
                // There's an active service worker controlling the page, so this is an update
                showUpdateBanner();
              } else {
                // No controller yet, this is the first install
                console.log('Service worker installed (first time)');
              }
            } else if (newWorker.state === 'activating') {
              console.log('Service worker activating...');
            }
          });
        });

        // Handle when the active service worker changes
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          console.log('Service worker changed, reloading page...');
          window.location.reload();
        });

        // Periodically check for updates (every 5 minutes)
        setInterval(() => {
          reg.update();
        }, 5 * 60 * 1000);
      })
      .catch(err => console.log('SW registration failed:', err));
  });
}
