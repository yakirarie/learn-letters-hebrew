<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>לומדים עברית</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2196F3">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3409/3409040.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff9f0; direction: rtl; -webkit-tap-highlight-color: transparent; }
    #app { padding: 0.75rem; text-align: center; max-width: 500px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 0.2rem; }

    .tabs { display: flex; gap: 6px; justify-content: center; margin: 0.5rem 0; flex-wrap: wrap; }
    .learning-tabs { margin-bottom: 0.3rem; }
    .games-tabs { margin-top: 0.3rem; border-top: 1px solid #eee; padding-top: 0.5rem; }
    .tab-btn {
      font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 20px;
      border: 1.5px solid #ddd; background: #fff; color: #666; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .tab-btn.active { background: #222; color: #fff; border-color: #222; }

    #letter-display {
      font-size: 130px; font-weight: 700; line-height: 1; margin: 0.3rem 0;
      transition: transform 0.15s; cursor: pointer; display: inline-block; user-select: none;
    }
    #letter-display:active { transform: scale(0.88); }
    #word-display { font-size: 28px; font-weight: 600; color: #222; margin: 0.2rem 0; min-height: 40px; }
    #picture { font-size: 72px; margin: 0.2rem 0; min-height: 80px; }
    #prompt { font-size: 15px; color: #555; margin-bottom: 0.5rem; min-height: 26px; }
    #mode-label { font-size: 12px; color: #aaa; margin-bottom: 0.1rem; letter-spacing: 0.04em; }

    .word-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 0.3rem 0; }
    .chip {
      font-size: 15px; padding: 5px 14px; border-radius: 20px; border: 1.5px solid #ddd;
      background: #fff; cursor: pointer; transition: all 0.12s; font-family: inherit; font-weight: 500;
    }
    .chip:hover { background: #f5f5f5; }
    .chip.active { color: #fff; border-color: transparent; }

    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 0.4rem; }
    .tap-btn {
      font-size: 15px; font-weight: 500; padding: 11px 20px; border-radius: 14px;
      border: 1.5px solid #ddd; background: #fff; color: #222; cursor: pointer;
      transition: background 0.12s, transform 0.1s; font-family: inherit;
    }
    .tap-btn:hover { background: #f0f0f0; }
    .tap-btn:active { transform: scale(0.96); }

    .star-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin: 0.2rem 0; }
    .star { font-size: 16px; transition: transform 0.2s; }
    .star.lit { transform: scale(1.3); }
    #progress-bar-wrap { background: #eee; border-radius: 8px; height: 7px; margin: 0.4rem auto; max-width: 280px; overflow: hidden; }
    #progress-bar { height: 100%; border-radius: 8px; transition: width 0.4s; }

    #trace-section { display: none; }
    #trace-section.visible { display: block; }
    #trace-wrap { position: relative; display: inline-block; margin: 0.4rem 0; }
    #trace-ghost {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 190px; font-weight: 700; opacity: 0.07; pointer-events: none;
      line-height: 1; user-select: none;
    }
    canvas#traceCanvas {
      border-radius: 16px; border: 2px dashed #ccc; background: #fffdf8;
      touch-action: none; cursor: crosshair; display: block;
    }
    .trace-controls { display: flex; gap: 10px; justify-content: center; margin-top: 0.4rem; flex-wrap: wrap; align-items: center; }
    .color-dot {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: transform 0.12s; flex-shrink: 0;
    }
    .color-dot.selected { border-color: #333; transform: scale(1.25); }

    #memory-section { display: none; }
    #memory-section.visible { display: block; }
    .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0.5rem 0; }
    .mem-card {
      aspect-ratio: 1; border-radius: 12px; border: 2px solid #ddd; background: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; user-select: none;
    }
    .mem-card.flipped { background: #e8f4ff; border-color: #90caf9; }
    .mem-card.matched { background: #e8f5e9; border-color: #81c784; opacity: 0.75; }
    .mem-card.shake { animation: shake 0.4s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    #mem-score { font-size: 15px; color: #555; margin: 0.4rem 0; font-weight: 500; }
  </style>
</head>
<body>
<div id="app">
  <h1>לומדים עברית 📖</h1>
  <button id="sound-toggle" class="tab-btn" style="position:fixed; top:10px; right:10px; z-index:1000; width:46px; height:46px; padding:0; font-size:20px; border-radius:50%;">🔊</button>
  <div id="update-banner" style="display:none; background:#ffeb3b; color:#333; border:1px solid #fbc02d; border-radius:10px; padding:8px 10px; margin:8px auto; max-width:500px; text-align:center;">
    גרסה חדשה זמינה. <button id="refresh-btn" class="tab-btn" style="font-size:13px; padding:5px 10px;">טען מחדש</button>
  </div>

  <div class="tabs learning-tabs" id="learning-tabs">
    <button class="tab-btn active" data-target="learn" onclick="switchTab('learn')">📚 אותיות</button>
    <button class="tab-btn" data-target="vowels" onclick="switchTab('vowels')">🔠 ניקוד</button>
    <button class="tab-btn" data-target="numbers" onclick="switchTab('numbers')">🔢 מספרים</button>
    <button class="tab-btn" data-target="wordplay" onclick="switchTab('wordplay')">🧩 כמות וחיבור</button>
    <button class="tab-btn" data-target="trace" onclick="switchTab('trace')">✏️ כתיבה</button>
    <button class="tab-btn" data-target="memory" onclick="switchTab('memory')">🃏 זיכרון</button>
  </div>
  <div class="tabs games-tabs" id="games-tabs">
    <button class="tab-btn" data-target="quiz" onclick="switchTab('quiz')">🎮 חידון</button>
  </div>

  <div id="mode-label"></div>
  <div class="star-row" id="stars"></div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>

  <div id="main-display">
    <div id="letter-display" onclick="onLetterTap()"></div>
    <div id="picture"></div>
    <div id="word-display"></div>
    <div class="word-chips" id="word-chips"></div>
    <div id="prompt"></div>
    <div class="btn-row" id="btn-row"></div>
  </div>

  <div id="trace-section">
    <div id="trace-letter-label" style="font-size:20px;font-weight:700;color:#333;margin:0.3rem 0;"></div>
    <div id="trace-wrap">
      <div id="trace-ghost"></div>
      <canvas id="traceCanvas" width="300" height="300"></canvas>
    </div>
    <div class="trace-controls">
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom:8px;">
      <button class="tap-btn" onclick="setTraceMode('letters')" style="padding:6px 16px;font-size:14px;">📚 אותיות</button>
      <button class="tap-btn" onclick="setTraceMode('numbers')" style="padding:6px 16px;font-size:14px;">🔢 מספרים</button>
    </div>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom:8px;">
      <div class="color-dot selected" style="background:#2196F3" onclick="setColor('#2196F3',this)"></div>
      <div class="color-dot" style="background:#E84040" onclick="setColor('#E84040',this)"></div>
      <div class="color-dot" style="background:#4CAF50" onclick="setColor('#4CAF50',this)"></div>
      <div class="color-dot" style="background:#FF9800" onclick="setColor('#FF9800',this)"></div>
      <div class="color-dot" style="background:#9C27B0" onclick="setColor('#9C27B0',this)"></div>
    </div>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <button class="tap-btn" onclick="clearTrace()" style="padding:6px 16px;font-size:14px;">🗑️ נקה</button>
      <button class="tap-btn" onclick="tracePrev()" style="padding:6px 16px;font-size:14px;">⬅ קודם</button>
      <button class="tap-btn" onclick="traceNext()" style="padding:6px 16px;font-size:14px;">הבא ⬅</button>
    </div>
    </div>
  </div>

  <div id="memory-section">
    <div id="mem-score"></div>
    <div class="memory-grid" id="memory-grid"></div>
    <div class="btn-row" style="margin-top:0.5rem;">
      <button class="tap-btn" onclick="startMemory()">🔄 משחק חדש</button>
    </div>
  </div>
</div>

const vowelExercises = [
  { word:'בית', options:['בֵּית','בַּיִת','בֹּיִת'], correct:'בַּיִת' },

  { name:'תפוחים', icons:'🍎🍎🍎', answer:3 },

let tab = 'learn';
let showNikud = false;
let current = 0;
let numberIndex = 0;
let vowelIndex = 0;
let wordplayIndex = 0;
let quizItems = [];
let currentQuizItem = null;
let quizIdx = 0;
let quizScore = 0;
let answered = false;
let traceMode = 'letters';

let appState = {
  soundEnabled: true,
  bestQuizScore: 0,
  lastTab: 'learn',
  currentLetter: 0,
  currentNumber: 0
};

function loadAppState() {
  try {
    const saved = JSON.parse(localStorage.getItem('learn-hebrew-app-state') || '{}');
    appState = { ...appState, ...saved };
  } catch (err) {
    console.warn('State load failed', err);
  }
  if (appState.lastTab) tab = appState.lastTab;
  current = appState.currentLetter || 0;
  numberIndex = appState.currentNumber || 0;
}

function saveAppState() {
  appState.lastTab = tab;
  appState.currentLetter = current;
  appState.currentNumber = numberIndex;
  localStorage.setItem('learn-hebrew-app-state', JSON.stringify(appState));
}

function setSoundEnabled(enabled) {
  appState.soundEnabled = enabled;
  document.getElementById('sound-toggle').textContent = enabled ? '🔊' : '🔇';
  saveAppState();
}
let traceIdx = 0, traceColor = '#2196F3';
let memCards = [], memFlipped = [], memMatched = [], memPairs = 0, memMoves = 0, memLock = false;

function pickExample(idx) {  const ex = letters[idx].examples;
  return ex[Math.floor(Math.random() * ex.length)];
}

function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function speak(text, rate=0.8, pitch=1.2) {
  if (!window.speechSynthesis || !appState.soundEnabled) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'he-IL'; u.rate = rate; u.pitch = pitch; u.volume = 1;
  speechSynthesis.speak(u);
}

function switchTab(t) {
  tab = t;

  document.querySelectorAll('#learning-tabs .tab-btn, #games-tabs .tab-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.target === t);
  });

  const mainDisplay = document.getElementById('main-display');
  const btnRow = document.getElementById('btn-row');
  mainDisplay.style.display = (t === 'learn' || t === 'quiz' || t === 'vowels' || t === 'numbers' || t === 'wordplay') ? 'block' : 'none';
  btnRow.style.display = (t === 'learn' || t === 'numbers' || t === 'quiz') ? 'flex' : 'none';

  document.getElementById('trace-section').className = t === 'trace' ? 'visible' : '';
  document.getElementById('memory-section').className = t === 'memory' ? 'visible' : '';

  const pageTitle = document.querySelector('#app h1');
  if (t === 'numbers') {
    pageTitle.textContent = 'לומדים מספרים 🔢';
    document.getElementById('mode-label').textContent = 'מספרים - למידה';
    showNumber(numberIndex);
  } else if (t === 'vowels') {
    pageTitle.textContent = 'תרגול ניקוד 🔠';
    document.getElementById('mode-label').textContent = 'תרגול ניקוד למילים';
    startVowels();
  } else if (t === 'wordplay') {
    pageTitle.textContent = 'תרגול כמות 🧩';
    document.getElementById('mode-label').textContent = 'תרגול כמות';
    startWordPlay();
  } else if (t === 'learn') {
    pageTitle.textContent = 'לומדים אותיות 📖';
    document.getElementById('mode-label').textContent = 'לחץ על האות כדי לשמוע אותה!';
    showLearn(current);
  } else if (t === 'quiz') {
    pageTitle.textContent = 'חידון 🎯';
    document.getElementById('mode-label').textContent = 'חידון מעורב';
    startQuiz();
  } else if (t === 'trace') {
    pageTitle.textContent = 'כתיבה ✏️';
    document.getElementById('mode-label').textContent = 'המשך לצייר על הלוח';
    showTrace(traceIdx);
  } else if (t === 'memory') {
    pageTitle.textContent = 'זיכרון 🃏';
    document.getElementById('mode-label').textContent = 'מצא זוגות תואמים';
    startMemory();
  }

  saveAppState();
  renderStars();
}

function setGameType(type) {
  gameType = type;

  if (type === 'letters') {
    showLearn(current);
  } else if (type === 'numbers') {
    showNumber(numberIndex);
  } else if (type === 'vowels') {
    startVowels();
  } else if (type === 'wordplay') {
    startWordPlay();
  }
}
function renderStars() {
  const row = document.getElementById('stars');
  const progressWrap = document.getElementById('progress-bar-wrap');
  if (tab !== 'quiz') {
    row.style.display = 'none';
    progressWrap.style.display = 'none';
    return;
  }

  row.style.display = 'flex';
  progressWrap.style.display = 'block';
  row.innerHTML = '';
  let total = 1;
  let currentProgress = 0;
  let color = '#673AB7';

  total = quizItems.length || 1;
  currentProgress = quizScore;

  for (let i = 0; i < total; i++) {
    const s = document.createElement('span');
    s.className = 'star' + (i < currentProgress ? ' lit' : '');
    s.textContent = i < currentProgress ? '⭐' : '☆';
    row.appendChild(s);
  }
  const bar = document.getElementById('progress-bar');
  bar.style.width = (total ? (currentProgress / total * 100) : 0) + '%';
  bar.style.background = color;
}

    const pool = shuffle(letters.filter((_, i) => i !== currentQuizItem.idx)).slice(0, 3).map(x => x.l);

    renderBtns(choices.map(ch => ({ label: ch, fn: () => checkQuizAnswer(ch), big: true })));

    document.getElementById('letter-display').style.color = '#5d4037';
    document.getElementById('letter-display').style.fontSize = '120px';

    document.getElementById('word-display').textContent = 'בחר את הניקוד הנכון';

    document.getElementById('prompt').textContent = '';

    const choices = shuffle(v.options.slice());
    renderBtns(choices.map(x => ({ label: x, fn: () => checkQuizAnswer(x), big: true })));
    speak('בחר את הניקוד הנכון למילה', 0.8, 1.2);

  } else {
    const c = wordplayChallenges[currentQuizItem.idx];
    document.getElementById('letter-display').textContent = c.icons;
    document.getElementById('letter-display').style.color = '#3f51b5';
    document.getElementById('letter-display').style.fontSize = '60px';
    document.getElementById('picture').textContent = '';

    document.getElementById('mode-label').textContent = '⁉️ חידון כמות';
    document.getElementById('prompt').textContent = '';

      .filter((v, i, a) => a.indexOf(v) === i));
    renderBtns(options.map(n => ({ label: String(n), fn: () => checkQuizAnswer(n), big: true })));
    speak('כמה פריטים יש כאן?', 0.8, 1.2);
  }

  renderStars();
}

function checkQuizAnswer(chosen) {
  if (answered) return;
  answered = true;

  let correctAnswer;
  let confirmationText = '';

  if (currentQuizItem.type === 'letter') {
    correctAnswer = letters[currentQuizItem.idx].l;
    confirmationText = 'כמו ' + pickExample(currentQuizItem.idx).word;
  } else if (currentQuizItem.type === 'number') {
    correctAnswer = numbers[currentQuizItem.idx].n;
    confirmationText = numbers[currentQuizItem.idx].word;
  } else if (currentQuizItem.type === 'vowel') {
    correctAnswer = vowelExercises[currentQuizItem.idx].correct;
    confirmationText = 'הניקוד הנכון הוא ' + correctAnswer;
  } else {
    correctAnswer = wordplayChallenges[currentQuizItem.idx].answer;
    confirmationText = 'התשובה נכונה היא ' + correctAnswer;
  }

  if (String(chosen) === String(correctAnswer)) {
    quizScore++;
    document.getElementById('prompt').textContent = '🎉 מצוין! ' + confirmationText;
    speak('כל הכבוד!', 0.85, 1.4);
    renderStars();
    setTimeout(() => { quizIdx++; nextMixedQuiz(); }, 1400);
  } else {
    document.getElementById('prompt').textContent = '🤔 לא בדיוק, נסה שוב.';
    speak('נסו שוב', 0.8, 1.1);
    setTimeout(() => { answered = false; document.getElementById('prompt').textContent = ''; }, 1000);
  }
}

function clearTrace() {
  const canvas = document.getElementById('traceCanvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

function tracePrev() {
  const arr = traceMode === 'letters' ? letters : numbers;
  traceIdx = (traceIdx - 1 + arr.length) % arr.length;
  showTrace(traceIdx);
}

function traceNext() {
  const arr = traceMode === 'letters' ? letters : numbers;
  traceIdx = (traceIdx + 1) % arr.length;
  showTrace(traceIdx);
}

function setTraceMode(mode) {
  traceMode = mode;
  traceIdx = 0;
  showTrace(traceIdx);
}

(function() {
  const canvas = document.getElementById('traceCanvas');
  const ctx = canvas.getContext('2d');
  let drawing = false, lx = 0, ly = 0;
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
  }
  function start(e) { e.preventDefault(); drawing = true; const p = getPos(e); lx=p.x; ly=p.y; }
  function move(e) {
    e.preventDefault();
    if (!drawing) return;
    const p = getPos(e);
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y);
    ctx.strokeStyle = traceColor; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
    lx=p.x; ly=p.y;
  }
  function end(e) { e.preventDefault(); drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end, {passive:false});
})();

// ── MEMORY GAME ───────────────────────────────────────────────────────
function startMemory() {
  document.getElementById('mode-label').textContent = 'משחק הזיכרון התחיל';
  memFlipped = []; memPairs = 0; memMoves = 0; memLock = false;

  const allItems = [
    ...letters.map(l => ({ kind: 'letter', id: l.l, display: l.l, color: l.color, pic: pickExample(letters.indexOf(l)).pic })),
  ];

  const chosen = shuffle(allItems).slice(0, 8);
  const pairs = [];

  chosen.forEach(item => {
    pairs.push({ id: item.id, display: item.display, color: item.color, type: 'letter' });
    pairs.push({ id: item.id, display: item.pic, color: item.color, type: 'pic' });
  });

  memCards = shuffle(pairs).map((c, i) => ({ ...c, idx: i, flipped: false, matched: false }));
  document.getElementById('mem-score').textContent = 'מצאו את כל הזוגות! 🔍 (8 זוגות)';
  renderMemory();
}

function renderMemory() {
  const grid = document.getElementById('memory-grid');
  grid.innerHTML = '';
  memCards.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'mem-card' + (c.flipped||c.matched ? ' flipped' : '') + (c.matched ? ' matched' : '');
    div.style.fontSize = c.type === 'letter' ? '32px' : '34px';
    if (c.flipped || c.matched) {
      div.textContent = c.display;
      if (c.type === 'letter') div.style.color = c.color;
    } else {
      div.textContent = '?';
      div.style.color = '#ccc';
    }
    div.onclick = () => flipCard(i);
    grid.appendChild(div);
  });
}

function flipCard(i) {
  if (memLock || memCards[i].flipped || memCards[i].matched) return;
  memCards[i].flipped = true;
  memFlipped.push(i);
  renderMemory();
  if (memCards[i].type === 'letter') speak(memCards[i].id, 0.8, 1.3);
  if (memFlipped.length === 2) {
    memLock = true; memMoves++;
    const [a, b] = memFlipped;
    if (memCards[a].id === memCards[b].id) {
      memCards[a].matched = memCards[b].matched = true;
      memPairs++;
      memFlipped = []; memLock = false;
      speak('כל הכבוד! זוג!', 0.85, 1.4);
      document.getElementById('mem-score').textContent = 'זוגות: ' + memPairs + '/6 | מהלכים: ' + memMoves;
      renderMemory();
      if (memPairs === 8) setTimeout(() => {
        speak('מדהים! מצאת את כל הזוגות!', 0.8, 1.4);
        document.getElementById('mem-score').textContent = '🏆 מעולה! ' + memMoves + ' מהלכים בסך הכל!';
      }, 400);
    } else {
      setTimeout(() => {
        memCards[a].flipped = memCards[b].flipped = false;
        memFlipped = []; memLock = false;
        document.getElementById('mem-score').textContent = 'נסו שוב! מהלכים: ' + memMoves;
        renderMemory();
      }, 900);
    }
  }
}

          const newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner();
              }
            });
          }
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      })
      .catch(err => console.log('SW registration failed:', err));
  });
}
  
</script>
</body>
